/* ------------ microsoftiiswebserver (ingest) --------- */
[INGEST:vendor="iis", product="iis", target_dataset="iis_iis_raw", no_hit = keep, content_id="microsoftiiswebserver"]
call MICROSOFT_IIS_PARSE_FIELDS;

[RULE:MICROSOFT_IIS_PARSE_FIELDS content_id="microsoftiiswebserver"]
filter _raw_log ~= "^\d{4}\-\d{2}\-\d{2}\s+\d{2}:\d{2}:\d{2}\s+"
| alter
    tmp_num_of_fields = array_length(regextract(_raw_log, "(\S+)"))
| alter
    // Access log only (Cribl source, no filebeat metadata)
    parsed_fields = if(
        tmp_num_of_fields >= 22,
        // W3C access schema:
        // date time s-sitename s-computername s-ip cs-method cs-uri-stem cs-uri-query
        // s-port cs-username c-ip cs-version cs(User-Agent) cs(Cookie) cs(Referer)
        // cs-host sc-status sc-substatus sc-win32-status sc-bytes cs-bytes time-taken
        regexcapture(_raw_log, "^(?P<date>\S+)\s+(?P<time>\S+)\s+(?P<s_sitename>\S+)\s+(?P<s_computername>\S+)\s+(?P<s_ip>\S+)\s+(?P<cs_method>\S+)\s+(?P<cs_uri_stem>\S+)\s+(?P<cs_uri_query>\S+)\s+(?P<s_port>\S+)\s+(?P<cs_username>\S+)\s+(?P<c_ip>\S+)\s+(?P<cs_version>\S+)\s+(?P<cs_user_agent>\S+)\s+(?P<cs_cookie>\S+)\s+(?P<cs_referer>\S+)\s+(?P<cs_host>\S+)\s+(?P<sc_status>\S+)\s+(?P<sc_substatus>\S+)\s+(?P<sc_win32_status>\S+)\s+(?P<sc_bytes>\S+)\s+(?P<cs_bytes>\S+)\s+(?P<time_taken>\S+)"),
        // fallback
        regexcapture(_raw_log, "(?P<date>\S+)\s+(?P<time>\S+)")
    )
| alter
    _time = parse_timestamp("%Y-%m-%d %H:%M:%S", format_string("%s %s", parsed_fields -> date, parsed_fields -> time)),
    parsed_fields = object_merge(parsed_fields, object_create("log_type", "Access Log"))
| fields - tmp_num_of_fields;
/* ------------ microsoftiiswebserver --------- */

/*START Banca Transilvania Ekran Parsing Rule*/

[INGEST:vendor="ekran_system", product="ekran_system", target_dataset="ekran_system_ekran_system_raw", no_hit=keep]
filter _raw_log ~= "\S{3}\s\d{2}\s\d{4}\s\d{2}\:\d{2}\:\d{2}"
| alter 
    tmp_time = arrayindex(regextract(_raw_log,"^(\S{3}\s\d{2}\s\d{4}\s\d{2}\:\d{2}\:\d{2})"),0),
    _time = parse_timestamp("%h %d %Y %H:%M:%S", tmp_time, "Europe/Bucharest")
| alter
    cat = arrayindex(regextract(_raw_log,"Cat=(\S+)\s+sev"),0),
    sev = arrayindex(regextract(_raw_log,"\ssev=(\d{1})\s+usrName"),0),
    usrName=arrayindex(regextract(_raw_log,"\susrName=\S+\\(.*)\s+identHostName"),0),
    identHostName=arrayindex(regextract(_raw_log,"\sidentHostName=(\S+)\s+dst"),0),
    dst=arrayindex(regextract(_raw_log,"\sdst=(\d+\.\d+\.\d+\.\d+)\s+src"),0),
    src=arrayindex(regextract(_raw_log,"\ssrc=(\d+\.\d+\.\d+\.\d+)\s+request"),0),
    request=arrayindex(regextract(_raw_log,"\srequest=(\S+)\s+utcDateTime"),0),
    ActivityTitle=arrayindex(regextract(_raw_log,"\sActivityTitle=(.*?)\s+[a|A]pplicationName"),0),
    ApplicationName=arrayindex(regextract(_raw_log,"\s[a|A]pplicationName=(\S+)\s+reason"),0),
    reason=arrayindex(regextract(_raw_log,"\sreason=(\S+)\s+URL"),0),
    URL=arrayindex(regextract(_raw_log,"\sURL=(\S+)\s+destinationDnsDomain"),0),
    destinationDnsDomain=arrayindex(regextract(_raw_log,"\sdestinationDnsDomain=(\S+)\s+UserComment"),0),
    UserComment=arrayindex(regextract(_raw_log,"\sUserComment=(.*?)$"),0)
| fields - tmp_time;

/*END Banca Transilvania Ekran Parsing Rule*/
