    // validate & divide ip addresses according to the version ipv4/6
    dst_ipv4_addresses = if(array_length(dst_ip_address) > 0, arrayfilter(arraymap(dst_ip_address, arrayindex(regextract("@element", "((?:\d{1,3}\.){3}\d{1,3})"), 0)), "@element" != null)),
