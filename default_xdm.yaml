    src_ipv4_addresses = if(array_length(xff_ipv4_addresses) > 0, 
        arraydistinct(arrayconcat(arrayfilter(arraymap(src_ip_addresses, arrayindex(regextract("@element", "((?:\d{1,3}\.){3}\d{1,3})"), 0)), "@element" != null), xff_ipv4_addresses)),
        arrayfilter(arraymap(src_ip_addresses, arrayindex(regextract("@element", "((?:\d{1,3}\.){3}\d{1,3})"), 0)), "@element" != null)),
