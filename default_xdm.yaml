    source_hostname = arrayindex(regextract(syslog_msg, "\[([^\]]*)\]"), 6)
| alter
    target_task_name = arrayindex(regextract(description, "Created task (.+?) on "), 0),
    vm_name = arrayindex(regextract(description, " on ([^\s]+) in datacenter"), 0)
