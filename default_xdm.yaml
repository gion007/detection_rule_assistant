[RULE: msft_azure_app_service_map_common_http_fields content_id="azureappservice"]
alter
        tmp_source_ip = coalesce(properties -> CIp, CIp)
| alter

		xdm.target.host.hostname = coalesce(properties -> CsHost, CsHost),

