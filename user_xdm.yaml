	dos_attack_event = arrayindex(regextract(_raw_log, "dos_attack_event=.(.*).,dos_attack_id="), 0),
	dos_attack_id = arrayindex(regextract(_raw_log, "dos_attack_id=.(.*).,dos_attack_latency="), 0),
//	dos_attack_latency = arrayindex(regextract(_raw_log, "dos_attack_latency=.(.*).,dos_attack_name="), 0),
	dos_attack_name = arrayindex(regextract(_raw_log, "dos_attack_name=.(.*).,dos_attack_tps="), 0),
